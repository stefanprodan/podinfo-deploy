apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: podinfo-frontend
  labels:
    app.kubernetes.io/name: podinfo-frontend
    app.kubernetes.io/part-of: podinfo
spec:
  rules:
    - host: podinfo.example.com
      http:
        paths:
          - backend:
              service:
                name: podinfo-frontend
                port:
                  number: 9898
            path: /
            pathType: ImplementationSpecific
