apiVersion: v1
kind: Service
metadata:
  name: podinfo-backend
  labels:
    app.kubernetes.io/name: podinfo-backend
    app.kubernetes.io/part-of: podinfo
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: podinfo-backend
  ports:
    - name: http
      port: 9898
      protocol: TCP
      targetPort: http
    - port: 9999
      targetPort: grpc
      protocol: TCP
      name: grpc
